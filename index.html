<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Christmas Crush</title>
<style>
  :root {
    --phone-w: 393px;
    --phone-h: 852px;
    --green: #009017;
    --ink: #1c1917;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #140c0a;
    font-family: "Avenir Next", "Segoe UI", Inter, system-ui, sans-serif;
  }
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
  }
  #stage {
    width: var(--phone-w);
    height: var(--phone-h);
    position: relative;
    overflow: hidden;
    background: #1a100c;
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
    transform-origin: center center;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: none;
  }
  .screen.on { display: block; }
  .plate {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
  }
  .snow, .lights, .shine {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .snow { z-index: 8; }
  .globe-snow {
    position: absolute;
    left: 52px;
    top: 124px;
    width: 292px;
    height: 292px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
  }
  .pug-live {
    position: absolute;
    left: 212px;
    top: 240px;
    width: 87px;
    height: 127px;
    pointer-events: none;
    z-index: 3;
  }
  .lights { z-index: 2; }
  .bulb {
    position: absolute;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
  }
  .bulb::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--halo);
    height: var(--halo);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 236, 196, .95) 0%, rgba(255, 176, 70, .55) 28%, rgba(255, 140, 40, .18) 52%, transparent 72%);
    mix-blend-mode: screen;
    animation: flicker var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
  }
  @keyframes flicker {
    0%, 100% { opacity: .28; transform: translate(-50%, -50%) scale(.92); }
    38% { opacity: .78; transform: translate(-50%, -50%) scale(1.08); }
    62% { opacity: .4; transform: translate(-50%, -50%) scale(.96); }
    82% { opacity: .7; transform: translate(-50%, -50%) scale(1.03); }
  }
  .shine-plaque {
    position: absolute;
    overflow: hidden;
    border-radius: 4px;
    pointer-events: none;
    z-index: 3;
  }
  .shine-plaque::after {
    content: "";
    position: absolute;
    top: -30%;
    bottom: -30%;
    width: 42%;
    left: -50%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0) 30%, rgba(255,248,220,.85) 50%, rgba(255,255,255,0) 70%, transparent 100%);
    animation: gleam 5.6s ease-in-out infinite;
  }
  @keyframes gleam {
    0%, 58% { transform: translateX(0); }
    82%, 100% { transform: translateX(380%); }
  }
  #play {
    position: absolute;
    left: 20px;
    top: 778px;
    width: 353px;
    height: 50px;
    border: 0;
    border-radius: 25px;
    background: transparent;
    color: transparent;
    cursor: pointer;
    z-index: 9;
  }
  #play:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  #play:active { background: rgba(255,255,255,.16); }
  #game .plate {
    inset: auto;
    left: -168px;
    top: -1px;
    width: 670px;
    height: 1047px;
    max-width: none;
    object-fit: fill;
    filter: blur(2px);
  }
  .chrome {
    position: absolute;
    left: 0;
    top: 0;
    width: 393px;
    height: 94px;
    z-index: 5;
    color: #fff;
    pointer-events: none;
  }
  .status {
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 10px;
    font-size: 15px;
    font-weight: 650;
  }
  .status svg { display: block; }
  .browser {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
  }
  .browser span { display: flex; gap: 2px; }
  .browser svg { width: 32px; height: 32px; display: block; }
  .scores {
    position: absolute;
    left: 16px;
    top: 100px;
    width: 361px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 6;
    color: #fff;
  }
  #pause {
    position: relative;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: #009017;
    cursor: pointer;
    flex: none;
  }
  #pause::before, #pause::after {
    content: "";
    position: absolute;
    top: 16.5px;
    width: 3px;
    height: 13px;
    border-radius: 1px;
    background: #fff;
  }
  #pause::before { left: 18.5px; }
  #pause::after { left: 24.5px; }
  #pause:focus-visible { outline: 3px solid #fff; }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1;
  }
  .stat span {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.8px;
  }
  .stat strong {
    margin-top: 0;
    font-size: 28px;
    line-height: 32px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .door {
    position: absolute;
    pointer-events: none;
    z-index: 3;
  }
  .door-l { left: -15px; top: 138px; }
  .door-r { left: 384px; top: 138px; }
  .board {
    position: absolute;
    left: 10px;
    top: 157px;
    width: 374px;
    height: 421px;
    padding: 3px 3px 4px;
    display: grid;
    grid-template-columns: repeat(8, 46px);
    grid-template-rows: repeat(9, 46px);
    gap: 0;
    background: #3b6c3d;
    box-shadow: 0 0 10px rgba(0,0,0,.8);
    z-index: 4;
  }
  .cell {
    width: 46px;
    height: 46px;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: url("assets/cell.svg") center / 46px 46px no-repeat;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .cell img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
  }
  .cell.selected img { transform: scale(1.08); filter: drop-shadow(0 0 5px rgba(226,168,54,.95)); }
  .cell.pop img { animation: pop .22s ease forwards; }
  .cell.drop img { animation: drop .22s ease; }
  @keyframes pop {
    to { transform: scale(.15); opacity: 0; }
  }
  @keyframes drop {
    from { transform: translateY(-18px); opacity: .4; }
    to { transform: none; opacity: 1; }
  }
  .timer {
    position: absolute;
    left: 16px;
    top: 590px;
    width: 361px;
    height: 8px;
    border: 1px solid #fff;
    border-radius: 99px;
    background: rgba(255,255,255,.75);
    overflow: hidden;
    z-index: 6;
  }
  .timer > i {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    background: #009017;
    border-radius: 99px;
  }
  .prize {
    position: absolute;
    left: 16px;
    top: 612px;
    width: 361px;
    height: 56px;
    padding: 0 12px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 24px;
    background: rgba(255,255,255,.13);
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-shadow: 0 0 5px #000;
    z-index: 6;
  }
  .prize .count {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    text-shadow: 0 0 10px rgba(0,0,0,.75);
  }
  .prize img { width: 23px; height: 24px; object-fit: contain; }
  .timer.low > i {
    background: #e23b32;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .55; } }
  .float {
    position: absolute;
    z-index: 7;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    text-shadow: 0 2px 6px rgba(0,0,0,.4);
    animation: rise .7s ease forwards;
    pointer-events: none;
  }
  @keyframes rise {
    to { transform: translateY(-28px); opacity: 0; }
  }
  .modal {
    position: absolute;
    inset: 0;
    z-index: 12;
    display: none;
    place-items: center;
    background: rgba(20,10,8,.28);
  }
  .modal.on { display: grid; }
  .card {
    width: 280px;
    padding: 26px 22px 20px;
    border-radius: 22px;
    background: rgba(255,252,247,.94);
    box-shadow: 0 16px 50px rgba(0,0,0,.28);
    text-align: center;
    color: var(--ink);
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
  }
  .card p { margin: 4px 0; font-size: 15px; }
  .card strong { font-size: 28px; }
  .card .actions { display: flex; gap: 8px; margin-top: 16px; }
  .card button {
    flex: 1;
    height: 44px;
    border: 0;
    border-radius: 22px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
  .card .again { background: var(--green); color: #fff; }
  .card .home { background: #efe8df; color: var(--ink); }
  .fx-toggles {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 12;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 8px;
  }
  .fx-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fx-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.6);
    background: rgba(28, 16, 10, .42);
    color: #fff;
    backdrop-filter: blur(8px);
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .fx-btn svg { width: 18px; height: 18px; display: block; }
  .fx-btn.on {
    background: rgba(255, 214, 120, .94);
    color: #5c3d12;
    border-color: rgba(255, 246, 214, .95);
  }
  .fx-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>

<script>
const COLS = 8, ROWS = 9, LIMIT = 60;
const TYPES = ["lantern", "snowman", "pug", "tree", "angel", "deer"];
const BEST_KEY = "christmas-crush-best";

const cover = document.getElementById("cover");
const game = document.getElementById("game");
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const giftsEl = document.getElementById("gifts");
const fillEl = document.getElementById("fill");
const timerEl = document.getElementById("timer");
const modal = document.getElementById("modal");

let board = [];
let selected = null;
let busy = false;
let running = false;
let paused = false;
let over = false;
let score = 0;
let gifts = 0;
let best = Number(localStorage.getItem(BEST_KEY) || 100234);
let left = LIMIT;
let lastTick = 0;

function commas(n) { return Math.max(0, Math.floor(n)).toLocaleString("en-US"); }

function show(which) {
  cover.classList.toggle("on", which === "cover");
  game.classList.toggle("on", which === "game");
}

function freshCell(r, c) {
  const pool = TYPES.filter((t) => {
    const left = c >= 2 && board[r][c - 1] === t && board[r][c - 2] === t;
    const up = r >= 2 && board[r - 1][c] === t && board[r - 2][c] === t;
    return !left && !up;
  });
  return pool[Math.floor(Math.random() * pool.length)];
}

function refillCell(r, c) {
  const pool = TYPES.filter((t) => {
    const left = c >= 2 && board[r][c - 1] === t && board[r][c - 2] === t;
    const down = r <= ROWS - 3 && board[r + 1][c] === t && board[r + 2][c] === t;
    return !left && !down;
  });
  return pool[Math.floor(Math.random() * pool.length)] || TYPES[0];
}

function makeBoard() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) board[r][c] = freshCell(r, c);
  }
  if (!hasMove()) shuffle();
}

function groupsOf(snapshot) {
  const found = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      let k = c + 1;
      while (k < COLS && snapshot[r][k] && snapshot[r][k] === snapshot[r][c]) k++;
      if (k - c >= 3) found.push({ cells: Array.from({ length: k - c }, (_, i) => [r, c + i]) });
      c = k;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      let k = r + 1;
      while (k < ROWS && snapshot[k][c] && snapshot[k][c] === snapshot[r][c]) k++;
      if (k - r >= 3) found.push({ cells: Array.from({ length: k - r }, (_, i) => [r + i, c]) });
      r = k;
    }
  }
  return found;
}

function hasMove() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c + 1 < COLS && wouldMatch(r, c, r, c + 1)) return true;
      if (r + 1 < ROWS && wouldMatch(r, c, r + 1, c)) return true;
    }
  }
  return false;
}

function wouldMatch(r1, c1, r2, c2) {
  const a = board[r1][c1], b = board[r2][c2];
  board[r1][c1] = b; board[r2][c2] = a;
  const ok = groupsOf(board).length > 0;
  board[r1][c1] = a; board[r2][c2] = b;
  return ok;
}

function shuffle() {
  const bag = board.flat();
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
  board = Array.from({ length: ROWS }, (_, r) => bag.slice(r * COLS, r * COLS + COLS));
  if (groupsOf(board).length || !hasMove()) makeBoard();
}

function render(drop) {
  boardEl.innerHTML = "";
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cell" + (drop ? " drop" : "");
      btn.setAttribute("aria-label", board[r][c] + " " + r + " " + c);
      if (selected && selected.r === r && selected.c === c) btn.classList.add("selected");
      const img = document.createElement("img");
      img.src = "assets/pieces/" + board[r][c] + ".png";
      img.alt = "";
      btn.appendChild(img);
      btn.addEventListener("click", () => onCell(r, c));
      boardEl.appendChild(btn);
    }
  }
}

function cellEl(r, c) { return boardEl.children[r * COLS + c]; }

function paintHud() {
  scoreEl.textContent = commas(score);

  fillEl.style.width = (p * 100) + "%";

}

function wait(ms) { return new Promise((res) => setTimeout(res, ms)); }

function floatScore(pts, r, c) {
  const el = document.createElement("div");
  el.className = "float";
  el.textContent = "+" + pts;
  const cell = cellEl(r, c);
  const stage = document.getElementById("stage");
  const a = cell.getBoundingClientRect();
  const b = stage.getBoundingClientRect();
  const scale = b.width / 393;
  el.style.left = ((a.left - b.left) / scale + 4) + "px";
  el.style.top = ((a.top - b.top) / scale - 6) + "px";
  game.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

async function resolve() {
  let chain = 0;
  while (true) {
    const groups = groupsOf(board);
    if (!groups.length) break;
    chain++;
    const marked = new Set();
    let pts = 0;
    groups.forEach((g) => {
      const n = g.cells.length;
      pts += 40 * n + (n - 3) * 30;
      g.cells.forEach(([r, c]) => marked.add(r + "," + c));
    });
    pts = Math.round(pts * (1 + (chain - 1) * 0.25));
    groups[0].cells.forEach(([r, c]) => cellEl(r, c).classList.add("pop"));
    marked.forEach((key) => {
      const [r, c] = key.split(",").map(Number);
      cellEl(r, c).classList.add("pop");
    });
    await wait(200);
    marked.forEach((key) => {
      const [r, c] = key.split(",").map(Number);
      board[r][c] = null;
    });
    score += pts;
    gifts = Math.floor(score / 1000);
    const [fr, fc] = groups[0].cells[0];
    for (let c = 0; c < COLS; c++) {
      const keep = [];
      for (let r = ROWS - 1; r >= 0; r--) if (board[r][c]) keep.push(board[r][c]);
      for (let r = ROWS - 1; r >= 0; r--) board[r][c] = keep.length ? keep.shift() : null;
    }
    for (let r = ROWS - 1; r >= 0; r--) {
      for (let c = 0; c < COLS; c++) if (!board[r][c]) board[r][c] = refillCell(r, c);
    }
    render(true);
    floatScore(pts, fr, fc);
    paintHud();
    await wait(210);
  }
  if (!hasMove()) {
    shuffle();
    render(false);
  }
}

async function onCell(r, c) {
  if (busy || paused || over || !running) return;
  if (!selected) {
    selected = { r, c };
    render(false);
    return;
  }
  if (selected.r === r && selected.c === c) {
    selected = null;
    render(false);
    return;
  }
  const dr = Math.abs(selected.r - r), dc = Math.abs(selected.c - c);
  if (dr + dc !== 1) {
    selected = { r, c };
    render(false);
    return;
  }
  const a = selected;
  selected = null;
  busy = true;
  const t = board[a.r][a.c];
  board[a.r][a.c] = board[r][c];
  board[r][c] = t;
  render(false);
  if (!groupsOf(board).length) {
    await wait(160);
    board[r][c] = board[a.r][a.c];
    board[a.r][a.c] = t;
    render(false);
  } else {
    await resolve();
  }
  busy = false;
  if (over) finish();
}

function startGame() {
  score = 0;
  gifts = 0;
  left = LIMIT;
  over = false;
  paused = false;
  busy = false;
  selected = null;
  running = true;
  modal.classList.remove("on");
  makeBoard();
  render(false);
  paintHud();
  show("game");
}

function finish() {
  if (modal.classList.contains("on")) return;
  running = false;
  over = true;
  if (score > best) {
    best = score;
    localStorage.setItem(BEST_KEY, String(best));
  }
  document.getElementById("modal-title").textContent = paused ? "Paused" : "Time's up";
  document.getElementById("modal-score").textContent = commas(score);
  document.getElementById("modal-gift").textContent = "Gift boxes " + gifts;
  document.getElementById("modal-best").textContent = "Best " + commas(best);
  const again = document.getElementById("again");
  again.textContent = paused ? "Resume" : "Play again";
  paintHud();
  modal.classList.add("on");
}

document.getElementById("play").addEventListener("click", startGame);
document.getElementById("pause").addEventListener("click", () => {
  if (over || !running) return;
  paused = true;
  finish();
});
document.getElementById("again").addEventListener("click", () => {
  if (paused && !overTime()) {
    paused = false;
    over = false;
    running = true;
    modal.classList.remove("on");
    document.getElementById("again").textContent = "Play again";
    return;
  }
  startGame();
});
document.getElementById("to-cover").addEventListener("click", () => {

  paused = false;
  over = false;
  modal.classList.remove("on");
  show("cover");
});

function overTime() { return left <= 0; }

function tick(now) {
  if (!lastTick) lastTick = now;
  const dt = Math.min(0.05, (now - lastTick) / 1000);
  lastTick = now;
  if (running && !paused && !over) {
    left -= dt;
    if (left <= 0) {
      left = 0;
      paused = false;
      finish();
    }
    paintHud();
  }
  stepSnow(dt);
  stepPug(dt);
  requestAnimationFrame(tick);
}

const glitterHalos = [

  glitterHalo("190,255,210")

function makeGlitter(extra) {

  const dist = Math.sqrt(Math.random()) * globeR * 0.97;
  const hueRoll = Math.random();
  return {
    x: GLOBE / 2 + Math.cos(ang) * dist,
    y: Math.min(268, GLOBE / 2 + Math.sin(ang) * dist),
    z: Math.random() * 2 - 1,
    vz: (Math.random() - 0.5) * 0.35,
    vx: (Math.random() - 0.5) * 10,
    vy: (Math.random() - 0.5) * 10,
    ang: Math.random() * Math.PI,
    spin: (Math.random() - 0.5) * (4 + Math.random() * 10),
    size: Math.random() < 0.84 ? 0.35 + Math.random() * 0.55 : 0.9 + Math.random() * 0.8,
    hue: hueRoll < 0.58 ? 0 : hueRoll < 0.84 ? 1 : 2,
    sharp: 3 + Math.random() * 7,
    phase: Math.random() * Math.PI * 2,
    wander: Math.random() * Math.PI * 2,
    wanderRate: 0.6 + Math.random() * 2.2,
    settle: Math.random() < 0.16,
    extra: extra

}
const glitter = [
  ...Array.from({ length: 520 }, () => makeGlitter(false)),
  ...Array.from({ length: 420 }, () => makeGlitter(true))
];
let globeTime = 0;
let globePump = false;
let pumpBurst = 0;
function stepGlobeSnow(dt) {
  if (!cover.classList.contains("on")) return;
  globeTime += dt;
  if (pumpBurst > 0) pumpBurst = Math.max(0, pumpBurst - dt);
  const pump = globePump ? 1 : 0;
  const burst = pumpBurst > 0 ? pumpBurst / 1.8 : 0;
  const cx = GLOBE / 2;
  const cy = GLOBE / 2 + 8;
  const swirl = (5 + pump * 22 + burst * 48) * (0.7 + 0.3 * Math.sin(globeTime * 0.37));
  const swirlSign = Math.sin(globeTime * 0.13 + burst * 2) >= 0 ? 1 : -1;
  const jitter = 9 + pump * 14 + burst * 20;
  globeCtx.clearRect(0, 0, GLOBE, GLOBE);
  globeCtx.save();
  globeCtx.beginPath();
  globeCtx.arc(GLOBE / 2, GLOBE / 2, globeR, 0, Math.PI * 2);
  globeCtx.clip();
  globeCtx.lineCap = "round";
  for (let i = 0; i < glitter.length; i++) {
    const p = glitter[i];
    if (p.extra && !pump) continue;
    const dx = p.x - cx;
    const dy = p.y - cy;
    const r = Math.hypot(dx, dy) || 1;
    const tx = -dy / r;
    const ty = dx / r;
    p.wander += (Math.sin(globeTime * p.wanderRate + p.phase) + (Math.random() - 0.5) * 1.4) * dt * 2.2;
    const sink = p.settle ? 14 : 3;
    const inward = r > globeR * 0.72 && !p.settle ? (r - globeR * 0.72) * 0.55 : 0;
    const wantX = tx * swirl * swirlSign * 0.45 + Math.cos(p.wander) * jitter - (dx / r) * inward;
    const wantY = ty * swirl * swirlSign * 0.45 + Math.sin(p.wander * 1.17 + p.phase) * jitter + sink - burst * 40 - (dy / r) * inward;
    const follow = Math.min(1, dt * (1.3 + burst));
    p.vx += (wantX - p.vx) * follow;
    p.vy += (wantY - p.vy) * follow;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    if (p.z > 1 || p.z < -1) p.vz *= -1;
    p.ang += p.spin * dt * (1 + pump * 1.8 + burst * 2.4);
    const ddx = p.x - GLOBE / 2;
    const ddy = p.y - GLOBE / 2;
    const rr = Math.hypot(ddx, ddy);
    if (rr > globeR - 1) {
      const nx = ddx / rr;
      const ny = ddy / rr;
      p.x = GLOBE / 2 + nx * (globeR - 1.4);
      p.y = GLOBE / 2 + ny * (globeR - 1.4);
      const vn = p.vx * nx + p.vy * ny;
      if (vn > 0) {
        p.vx -= vn * nx * 1.35;
        p.vy -= vn * ny * 1.35;
      }
      p.vx += -ny * swirlSign * 10 * dt;
      p.vy += nx * swirlSign * 10 * dt;
    }
    const floorGone = 296;
    if (p.y > floorGone) {
      p.y = floorGone - (p.y - floorGone);
      if (p.vy > 0) p.vy *= -0.4;
    }
    const gy = p.y - GLOBE / 2;
    const gx = p.x - GLOBE / 2;
    const rim = Math.hypot(gx, gy) / globeR;
    let floorFade = Math.max(0, Math.min(1, (floorGone - p.y) / 26));
    if (gy > 108 && rim > 0.78) floorFade *= 1 - Math.min(1, (rim - 0.78) / 0.18);
    if (floorFade <= 0.02) continue;
    const depth = 0.5 + 0.5 * (p.z * 0.5 + 0.5);
    const facing = Math.cos(p.ang - 0.7);
    const power = p.sharp * (pump ? 0.7 : 1);
    const glint = Math.min(1, Math.pow(Math.max(0, facing), power) + Math.pow(Math.max(0, -facing), power * 0.75) * 0.45);
    const speck = Math.max(0.6, p.size * depth * 1.15);
    globeCtx.globalAlpha = (0.16 + glint * 0.2) * (0.45 + depth * 0.55) * floorFade;
    globeCtx.fillStyle = GLITTER_INK[p.hue];
    globeCtx.fillRect(p.x - speck / 2, p.y - speck / 2, speck, speck);
    if (glint > 0.18) {
      const len = 0.7 + glint * p.size * 2.8 * depth;
      const c = Math.cos(p.ang);
      const s = Math.sin(p.ang);
      globeCtx.globalAlpha = Math.min(1, 0.2 + glint * 0.85) * floorFade;
      globeCtx.strokeStyle = glint > 0.82 ? "#fff" : GLITTER_INK[p.hue];
      globeCtx.lineWidth = 0.45 + glint * 0.45;
      globeCtx.beginPath();
      globeCtx.moveTo(p.x - c * len, p.y - s * len);
      globeCtx.lineTo(p.x + c * len, p.y + s * len);
      globeCtx.stroke();
      globeCtx.globalAlpha = Math.min(1, glint) * floorFade;
      globeCtx.fillStyle = glint > 0.75 ? "#fff" : GLITTER_INK[p.hue];
      const core = 0.7 + glint * 1.05;
      globeCtx.fillRect(p.x - core / 2, p.y - core / 2, core, core);
    }
    if (glint > 0.78) {
      const halo = 1.6 + glint * 2.4;
      globeCtx.globalAlpha = (glint - 0.55) * 0.7 * floorFade;
      globeCtx.drawImage(glitterHalos[p.hue], p.x - halo, p.y - halo, halo * 2, halo * 2);
    }
  }
  globeCtx.restore();
  globeCtx.globalAlpha = 1;
}

function pugSample(x, y) {

  const fx = x - xi, fy = y - yi;

  const i10 = i00 + 4;
  const i01 = i00 + pugW * 4;
  const i11 = i01 + 4;
  const out = [0, 0, 0, 0];
  for (let c = 0; c < 4; c++) {
    const a = pugSrc[i00 + c] * (1 - fx) + pugSrc[i10 + c] * fx;
    const b = pugSrc[i01 + c] * (1 - fx) + pugSrc[i11 + c] * fx;
    out[c] = a * (1 - fy) + b * fy;
  }
  return out;
}
function smoothStep(u) {
  u = u < 0 ? 0 : u > 1 ? 1 : u;
  return u * u * (3 - 2 * u);
}

function eyeBlink(dt) {
  if (!dogActs.blink) {
    blinkClock.phase = -1;
    return 0;

  if (blinkClock.phase < 0) {
    blinkClock.wait -= dt;
    if (blinkClock.wait > 0) return 0;
    blinkClock.phase = 0;
  }
  blinkClock.phase += dt;
  const dur = 0.2;
  if (blinkClock.phase >= dur) {
    blinkClock.phase = -1;
    blinkClock.wait = 1.3 + Math.random() * 3.8;
    return 0;

  const data = pugOut.data;
  data.fill(0);

    const inChest = y > 80 && y < 112;
    const belly = inChest ? Math.exp(-((y - 100) * (y - 100)) / 260) : 0;

    const inRear = tailY > 70 && tailY < 110;
    const rear = inRear ? Math.sin((tailY - 70) / 40 * Math.PI) : 0;
    const head = y < 74 ? 1 : y < 90 ? 1 - smoothStep((y - 74) / 16) : 0;
    const headDrop = breath * 1.1 * head;
    for (let x = 0; x < pugW; x++) {
      let sx = x, sy = y;
      if (chest) {
        sx -= (x - 42) * breath * 0.025 * chest;
        sy -= breath * 0.42 * belly * (y < 108 ? 1 : 0);
      }
      if (headDrop) sy -= headDrop;
      if (blinkL > 0.01 || blinkR > 0.01) {
        for (let i = 0; i < 2; i++) {
          const amount = i ? blinkR : blinkL;
          if (amount < 0.01) continue;
          const eye = blinkEyes[i];
          const eyeY = eye.y + breath * 1.1;
          const nx = (x - eye.x) / eye.rx, ny = (y - eyeY) / eye.ry;
          const r2 = nx * nx + ny * ny;
          if (r2 >= 1) continue;
          const shut = amount * Math.pow(1 - r2, 0.5);
          const lidY = eye.y - eye.ry + 0.4;
          const target = lidY + (y - eyeY) * 0.12;
          sy += (target - sy) * shut;
        }
      }
      if (wag && rear) {
        const side = smoothStep((x - 74) / 16);
        sx -= wag * side * rear;
      }
      const p = pugSample(sx, sy);
      const o = (y * pugW + x) * 4;
      data[o] = p[0];
      data[o + 1] = p[1];
      data[o + 2] = p[2];
      data[o + 3] = p[3];
    }
  }
  pugCtx.putImageData(pugOut, 0, 0);
}

function fit() {
  const pad = 16;
  const scale = Math.min((window.innerWidth - pad) / 393, (window.innerHeight - pad) / 852, 1.25);
  document.getElementById("stage").style.transform = "scale(" + scale + ")";
}
window.addEventListener("resize", fit);
fit();
bestEl.textContent = commas(best);
requestAnimationFrame(tick);
</script>
